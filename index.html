<style>
:root{
  --cream:#FAF7F0; --paper:#FFFFFF; --sand:#EFE9DC; --beige:#E3D9C6; --beige-deep:#D2C4AC;
  --olive:#5F6E51; --olive-deep:#3F4A39; --olive-mid:#7B876C; --sage:#9EAB8C; --sage-soft:#C7CEB7;
  --silver:#AEB2B6; --silver-lo:#8D9297; --silver-hi:#E7E9EB;
  --ink:#2E3227; --ink-soft:#5A5D4E; --muted:#8B8B7C;
  --ok:#5E7B4E; --ok-bg:#E7EFDD; --warn:#B4863E; --warn-bg:#F5EBD6; --danger:#A8583F; --danger-bg:#F3E2DA;
  --line:#E4DFD2; --shadow:0 1px 2px rgba(60,66,48,.06),0 6px 22px rgba(60,66,48,.07);
  --shadow-lg:0 10px 40px rgba(60,66,48,.14);
  --metal:linear-gradient(135deg,#E7E9EB 0%,#AEB2B6 38%,#F2F3F4 55%,#9096 56%,#B7BBBF 78%,#DDE0E2 100%);
  --r:14px; --r-sm:9px; --nav-w:236px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Jost',system-ui,sans-serif;background:var(--cream);color:var(--ink);font-weight:400;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.serif{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;letter-spacing:.2px;color:var(--olive-deep);line-height:1.12}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
a{color:var(--olive)}
::selection{background:var(--sage-soft)}
.hidden{display:none!important}

/* ---------- LOGIN ---------- */
#login{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 120% at 50% 0%,#FCFAF4 0%,#EFE9DC 60%,#E3D9C6 100%);padding:20px;overflow:auto}
.login-card{text-align:center;max-width:600px;width:100%;animation:rise .7s cubic-bezier(.2,.7,.2,1);padding:8px 0}
.crest{width:96px;height:96px;object-fit:contain;filter:drop-shadow(0 8px 18px rgba(60,66,48,.16))}
.login-names{font-size:clamp(32px,8vw,46px);color:var(--olive-deep);margin:6px 0 2px;line-height:1.05;white-space:nowrap}
.login-amp{font-style:italic;color:var(--sage);font-size:.72em;vertical-align:4px;margin:0 8px}
.login-sub{font-family:'Jost';font-weight:300;letter-spacing:5px;text-transform:uppercase;font-size:11px;color:var(--olive-mid);margin-bottom:2px}
.login-date{font-family:'Cormorant Garamond';font-size:19px;color:var(--olive-mid);font-style:italic;margin-bottom:14px}
.metal-rule{height:2px;width:110px;margin:12px auto;background:var(--metal);border-radius:2px;opacity:.9}
.who{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.who-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.who-btn{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 18px;width:158px;
  box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s,border-color .18s}
.who-btn:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--sage)}
.who-btn .nm{font-family:'Cormorant Garamond';font-size:25px;color:var(--olive-deep);line-height:1.1}
.who-btn .rl{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-top:2px}
.who-av{width:46px;height:46px;border-radius:50%;margin:0 auto 7px;display:flex;align-items:center;justify-content:center;
  font-family:'Cormorant Garamond';font-size:22px;color:#fff}

/* ---------- APP SHELL ---------- */
#app{display:flex;min-height:100vh}
nav#side{width:var(--nav-w);background:linear-gradient(180deg,var(--olive-deep),#343d2c);color:#EDEEE4;
  position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;padding:20px 0;z-index:40}
.side-brand{display:flex;align-items:center;gap:11px;padding:2px 20px 16px}
.side-brand img{width:42px;height:42px;object-fit:contain}
.side-brand .t{font-family:'Cormorant Garamond';font-size:24px;color:#fff;line-height:1}
.side-brand .s{font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:var(--sage-soft)}
.side-links{list-style:none;overflow-y:auto;flex:1;padding:6px 12px}
.side-links li{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:10px;font-size:14px;
  color:#D7DAC9;cursor:pointer;transition:background .15s,color .15s;margin-bottom:2px}
.side-links li:hover{background:rgba(255,255,255,.06);color:#fff}
.side-links li.active{background:rgba(255,255,255,.12);color:#fff}
.side-links li.active .ico{filter:drop-shadow(0 0 6px rgba(195,199,174,.5))}
.side-links .ico{width:19px;text-align:center;font-size:16px;opacity:.92}
.side-foot{padding:12px 18px;border-top:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px}
.side-foot .av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Cormorant Garamond';font-size:18px}
.side-foot .nm{font-size:13px;color:#fff}.side-foot .sw{font-size:10.5px;color:var(--sage-soft);cursor:pointer}
.side-foot .sw:hover{color:#fff;text-decoration:underline}

main{margin-left:var(--nav-w);flex:1;min-width:0;padding:26px 30px 90px}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.view-head h1{font-size:38px}
.view-head .sub{font-size:13px;color:var(--muted);margin-top:2px}
.head-actions{display:flex;gap:9px;flex-wrap:wrap}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:10px;font-size:13.5px;font-weight:500;
  background:var(--paper);border:1px solid var(--line);color:var(--ink);box-shadow:var(--shadow);transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--sage);transform:translateY(-1px)}
.btn-pri{background:var(--olive);color:#fff;border-color:var(--olive)}
.btn-pri:hover{background:var(--olive-deep);border-color:var(--olive-deep)}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn-ghost{background:transparent;box-shadow:none;border-color:transparent}
.btn-ghost:hover{background:var(--sand);border-color:transparent;transform:none}
.icon-btn{width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);background:transparent}
.icon-btn:hover{background:var(--sand);color:var(--ink)}

/* cards */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:100px;font-size:11.5px;font-weight:500;letter-spacing:.2px}
.b-ok{background:var(--ok-bg);color:var(--ok)} .b-warn{background:var(--warn-bg);color:var(--warn)}
.b-mut{background:var(--sand);color:var(--ink-soft)} .b-dan{background:var(--danger-bg);color:var(--danger)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}

/* toast */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--olive-deep);
  color:#fff;padding:12px 20px;border-radius:100px;font-size:13.5px;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;
  transition:.3s;z-index:80;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(46,50,39,.42);backdrop-filter:blur(3px);z-index:70;display:flex;
  align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:.2s}
.modal-bg.show{opacity:1;pointer-events:auto}
.modal{background:var(--paper);border-radius:18px;box-shadow:var(--shadow-lg);width:100%;max-width:520px;max-height:88vh;
  overflow-y:auto;transform:scale(.96);transition:.2s}
.modal-bg.show .modal{transform:scale(1)}
.modal-h{padding:20px 24px 6px;display:flex;justify-content:space-between;align-items:center}
.modal-h h3{font-size:26px}
.modal-b{padding:8px 24px 22px}
.modal-f{padding:14px 24px 20px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--paper)}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;letter-spacing:.4px;color:var(--ink-soft);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--cream);transition:.15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--sage);background:#fff;box-shadow:0 0 0 3px rgba(154,162,132,.16)}
.field textarea{min-height:70px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

/* stepper */
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--cream)}
.stepper button{width:34px;height:36px;font-size:18px;color:var(--olive);background:#fff}
.stepper button:hover{background:var(--sand)}
.stepper span{min-width:34px;text-align:center;font-weight:500}

/* ===== DASHBOARD ===== */
.hero{position:relative;background:linear-gradient(160deg,#4A5540 0%,#3F4A39 55%,#333d2e 100%);border-radius:22px;
  padding:38px 34px;color:#F2F2E9;overflow:hidden;box-shadow:var(--shadow-lg);margin-bottom:20px}
.hero .sprig{position:absolute;opacity:.14;pointer-events:none}
.hero-crest{width:74px;height:74px;object-fit:contain;margin-bottom:10px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.3))}
.hero h1{color:#fff;font-size:52px;margin-bottom:2px}
.hero .amp{font-style:italic;color:var(--sage-soft);margin:0 8px}
.hero .when{font-family:'Cormorant Garamond';font-style:italic;font-size:20px;color:#D6DAC4;margin-bottom:22px}
.count{display:flex;gap:14px;flex-wrap:wrap}
.count .u{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:14px 18px;min-width:80px;text-align:center;backdrop-filter:blur(2px)}
.count .n{font-family:'Cormorant Garamond';font-size:44px;color:#fff;line-height:1}
.count .l{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--sage-soft);margin-top:4px}
.hero-quote{margin-top:22px;font-family:'Cormorant Garamond';font-style:italic;font-size:19px;color:#E4E6D7;max-width:520px}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:20px}
.stat{padding:18px 20px}
.stat .k{font-size:12px;letter-spacing:.5px;color:var(--muted);display:flex;align-items:center;gap:7px}
.stat .v{font-family:'Cormorant Garamond';font-size:34px;color:var(--olive-deep);margin-top:4px}
.stat .m{font-size:12px;color:var(--ink-soft);margin-top:2px}
.dash-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mini-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px 4px}
.mini-h h3{font-size:22px}.mini-h a{font-size:12px;color:var(--olive-mid);cursor:pointer}
.mini-list{padding:6px 20px 18px}
.mini-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.mini-row:last-child{border-bottom:none}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:20px}
.qcard{padding:16px;text-align:center;cursor:pointer;transition:.16s}
.qcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--sage)}
.qcard .qi{font-size:24px;margin-bottom:6px}
.qcard .qt{font-size:13px;font-weight:500;color:var(--olive-deep)}
.qcard .qn{font-size:11px;color:var(--muted)}

/* ===== PRESUPUESTO ===== */
.money-toggle{display:inline-flex;background:var(--sand);border-radius:9px;padding:3px}
.money-toggle button{padding:5px 12px;border-radius:7px;font-size:12.5px;color:var(--ink-soft)}
.money-toggle button.on{background:#fff;color:var(--olive-deep);box-shadow:var(--shadow);font-weight:500}
.bud-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px}
.progress{height:9px;background:var(--sand);border-radius:100px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--sage),var(--olive));border-radius:100px}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
table.tbl th{text-align:left;font-weight:500;font-size:11.5px;letter-spacing:.5px;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line)}
table.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tr:hover td{background:var(--cream)}
.num{font-variant-numeric:tabular-nums;text-align:right}
.cat-head td{background:var(--sand)!important;font-family:'Cormorant Garamond';font-size:17px;color:var(--olive-deep);padding:8px 12px}
.chart-wrap{padding:20px;display:flex;flex-direction:column}
.chart-box{position:relative;height:280px}
.seg{display:inline-flex;background:var(--sand);border-radius:8px;padding:3px}
.seg button{padding:5px 12px;border-radius:6px;font-size:12.5px;color:var(--ink-soft)}
.seg button.on{background:#fff;color:var(--olive-deep);box-shadow:var(--shadow);font-weight:500}
.fin-out{background:var(--ok-bg);border-radius:12px;padding:16px 18px;margin-top:12px}
.fin-out .big{font-family:'Cormorant Garamond';font-size:34px;color:var(--olive-deep)}

/* ===== INVITADOS ===== */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.search{position:relative;flex:1;min-width:180px;max-width:320px}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.search span{position:absolute;left:11px;top:9px;color:var(--muted)}
.chip{padding:6px 13px;border-radius:100px;font-size:12.5px;border:1px solid var(--line);background:var(--paper);color:var(--ink-soft)}
.chip.on{background:var(--olive);color:#fff;border-color:var(--olive)}
.g-counts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:18px}
.gc{padding:14px 16px}
.gc .v{font-family:'Cormorant Garamond';font-size:30px;color:var(--olive-deep)}
.gc .l{font-size:11.5px;color:var(--muted);letter-spacing:.4px}
.grp{margin-bottom:14px}
.grp-h{display:flex;align-items:center;gap:10px;padding:10px 4px;cursor:pointer}
.grp-h .cc{width:12px;height:12px;border-radius:4px}
.grp-h h3{font-size:20px;flex:1}
.grp-h .gtot{font-size:12px;color:var(--muted)}
.g-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line)}
.g-item:last-child{border-bottom:none}
.g-item .nm{flex:1;font-size:14px}
.g-item.conf .nm{color:var(--ok);font-weight:500}
.g-item .pc{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.status-sel{font-size:12px;padding:4px 8px;border-radius:7px;border:1px solid var(--line);background:var(--cream)}

/* ===== MESAS ===== */
.mesa-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.plano{position:relative;background:
  linear-gradient(var(--line) 1px,transparent 1px) 0 0/26px 26px,
  linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/26px 26px,var(--paper);
  border:1px solid var(--line);border-radius:16px;height:560px;overflow:hidden;touch-action:none}
.mesa{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;cursor:grab;user-select:none}
.mesa.dragging{cursor:grabbing;z-index:20}
.mesa-top{background:var(--paper);border:2px solid var(--sage);border-radius:50%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;box-shadow:var(--shadow);position:relative}
.mesa-top.rect{border-radius:14px}
.mesa.full .mesa-top{border-color:var(--olive)}
.mesa.over .mesa-top{border-color:var(--danger);background:var(--danger-bg)}
.mesa-name{font-family:'Cormorant Garamond';font-size:16px;color:var(--olive-deep);line-height:1}
.mesa-occ{font-size:10px;color:var(--muted);margin-top:1px}
.seat{position:absolute;width:15px;height:15px;border-radius:50%;background:var(--sand);border:1px solid var(--beige-deep)}
.seat.taken{background:var(--sage)}
.mesa-fams{margin-top:5px;display:flex;flex-wrap:wrap;gap:3px;max-width:140px;justify-content:center}
.fam-tag{font-size:9.5px;padding:1px 6px;border-radius:100px;color:#fff;white-space:nowrap;cursor:pointer}
.unassigned{position:absolute;top:12px;right:12px;width:190px;max-height:calc(100% - 24px);overflow-y:auto;background:rgba(255,255,255,.96);
  border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:10px}
.unassigned h4{font-size:15px;margin-bottom:8px}
.ua-item{font-size:12px;padding:6px 8px;border-radius:7px;cursor:pointer;display:flex;justify-content:space-between;gap:6px;align-items:center}
.ua-item:hover{background:var(--sand)}

/* ===== CRONOGRAMA / PENDIENTES sortable ===== */
.tl-item,.pend-item,.idea-item{background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);margin-bottom:10px}
.tl-item{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:grab}
.tl-item.dragging{opacity:.5}
.tl-time{font-family:'Cormorant Garamond';font-size:24px;color:var(--olive);min-width:74px}
.tl-body{flex:1}.tl-body .t{font-weight:500}.tl-body .d{font-size:12.5px;color:var(--muted)}
.grip{color:var(--beige-deep);cursor:grab}

/* PENDIENTES */
.pend-item{display:flex;align-items:flex-start;gap:12px;padding:14px 16px}
.check{width:22px;height:22px;border-radius:7px;border:2px solid var(--sage);flex:none;margin-top:1px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:#fff;transition:.15s}
.check.on{background:var(--olive);border-color:var(--olive)}
.pend-item.done .pt{text-decoration:line-through;color:var(--muted)}
.pt{font-weight:500}.pd{font-size:13px;color:var(--ink-soft);margin-top:2px}
.pmeta{display:flex;gap:8px;margin-top:7px;flex-wrap:wrap;align-items:center}

/* CALENDARIO */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{text-align:center;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);padding:4px}
.cal-cell{min-height:82px;border:1px solid var(--line);border-radius:10px;padding:6px;background:var(--paper);font-size:12px}
.cal-cell.out{background:var(--cream);opacity:.5}
.cal-cell.today{border-color:var(--olive);box-shadow:0 0 0 2px rgba(91,98,72,.18)}
.cal-day{font-weight:500;color:var(--ink-soft)}
.cal-ev{margin-top:3px;font-size:10.5px;padding:2px 5px;border-radius:5px;background:var(--ok-bg);color:var(--ok);cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-ev.pago{background:var(--warn-bg);color:var(--warn)}
.cal-ev.prov{background:#E6E3EC;color:#6A6285}

/* PROVEEDORES / IDEAS */
.prov-grid,.idea-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.prov{padding:18px}
.prov .pn{font-family:'Cormorant Garamond';font-size:23px;color:var(--olive-deep)}
.prov .ps{font-size:12.5px;color:var(--olive-mid);margin-bottom:8px}
.prov .pr{font-size:13px;color:var(--ink-soft);display:flex;gap:8px;margin:3px 0;align-items:center}
.prov .pr .k{color:var(--muted);min-width:66px}
.idea-item{padding:15px 16px}
.idea-item .it{font-size:14px}.idea-item .il{font-size:12px;margin-top:6px;display:inline-block}
.idea-author{font-size:11px;padding:2px 9px;border-radius:100px;color:#fff;display:inline-flex;align-items:center;gap:5px}

/* POST-ITS */
.board{position:relative;min-height:520px;background:
  radial-gradient(circle at 14px 14px,var(--beige) 1.4px,transparent 1.5px) 0 0/28px 28px,var(--sand);
  border-radius:16px;border:1px solid var(--line);overflow:hidden;touch-action:none}
.postit{position:absolute;width:172px;min-height:172px;padding:14px 14px 30px;border-radius:3px;
  box-shadow:2px 6px 16px rgba(60,66,48,.16);cursor:grab;transform:rotate(-1.4deg);transition:box-shadow .15s}
.postit:nth-child(even){transform:rotate(1.6deg)}
.postit.dragging{cursor:grabbing;box-shadow:6px 14px 28px rgba(60,66,48,.26);z-index:20;transition:none}
.postit textarea{width:100%;height:118px;background:transparent;border:none;resize:none;font-family:'Jost';font-size:13.5px;color:#4a4a3a;line-height:1.42}
.postit textarea:focus{outline:none}
.postit .pi-x{position:absolute;top:5px;right:7px;font-size:15px;color:rgba(0,0,0,.28);cursor:pointer}
.postit .pi-a{position:absolute;bottom:8px;left:12px;font-size:10.5px;color:rgba(0,0,0,.4)}

.empty{text-align:center;padding:46px 20px;color:var(--muted)}
.empty .ei{font-size:34px;opacity:.5;margin-bottom:8px}
.empty h3{font-size:22px;color:var(--ink-soft);margin-bottom:4px}

/* mobile nav */
#burger,#mtitle{display:none}
@media(max-width:860px){
  nav#side{transform:translateX(-100%);transition:transform .25s;box-shadow:var(--shadow-lg)}
  nav#side.open{transform:translateX(0)}
  main{margin-left:0;padding:16px 15px 84px}
  #topbar{display:flex!important}
  .dash-cols{grid-template-columns:1fr}
  .row3{grid-template-columns:1fr}
  .view-head h1{font-size:30px}.hero h1{font-size:38px}
  .scrim.show{position:fixed;inset:0;background:rgba(46,50,39,.4);z-index:35}
}
#topbar{display:none;position:sticky;top:0;z-index:30;background:var(--cream);align-items:center;gap:12px;
  padding:10px 4px 12px;margin:-16px -15px 12px;border-bottom:1px solid var(--line)}
#topbar #burger{display:block;font-size:22px;color:var(--olive-deep);padding:4px 8px}
#topbar .mt{font-family:'Cormorant Garamond';font-size:22px;color:var(--olive-deep)}
@media print{nav#side,#topbar,.head-actions,.no-print{display:none!important}main{margin:0;padding:0}}

/* edit mode (reordenar) */
.editing .side-links li,.editing .qcard{cursor:grab;position:relative}
.editing .side-links li{outline:1px dashed rgba(255,255,255,.35);outline-offset:-2px}
.editing .qcard{outline:2px dashed var(--sage);outline-offset:-2px;animation:wiggle .4s ease-in-out infinite alternate}
@keyframes wiggle{from{transform:rotate(-.5deg)}to{transform:rotate(.5deg)}}
.editing .qcard:hover{transform:none}
.drag-hint{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--olive-mid);background:var(--ok-bg);padding:5px 11px;border-radius:100px}
.dragover-key{box-shadow:0 0 0 2px var(--olive) inset}
.stat.clk{cursor:pointer;transition:transform .15s,box-shadow .15s}
.stat.clk:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}

/* fotos en ideas */
.idea-img{width:100%;max-height:180px;object-fit:cover;border-radius:10px;margin-top:10px;cursor:zoom-in}
#ideaPrev img{max-height:120px;border-radius:8px}
.imgbox{position:fixed;inset:0;background:rgba(46,50,39,.82);z-index:90;display:flex;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
.imgbox img{max-width:92vw;max-height:88vh;border-radius:10px;box-shadow:var(--shadow-lg)}

/* tablero de notas en inicio */
.dash-board{min-height:300px;margin-bottom:20px}
.file-btn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border:1px dashed var(--sage);border-radius:10px;color:var(--olive-mid);font-size:13px;cursor:pointer;background:var(--cream)}
.file-btn:hover{background:var(--sand)}

/* rotación de frase */
.hero-quote{transition:opacity .5s}
.hero-quote.fade{opacity:0}
.mesa-edit{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;background:var(--paper);
  border:1px solid var(--line);box-shadow:var(--shadow);font-size:12px;display:flex;align-items:center;justify-content:center;z-index:3}
.mesa-edit:hover{background:var(--sand)}

/* pantalla de PIN */
.pin-wrap{max-width:280px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.pin-in{text-align:center;font-size:22px;letter-spacing:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.pin-in:focus{outline:none;border-color:var(--sage);box-shadow:0 0 0 3px rgba(154,162,132,.18)}
.pin-btns{display:flex;gap:10px;justify-content:center}
.pin-msg{font-size:12.5px;color:var(--danger);min-height:16px;text-align:center}
.pin-forgot{font-size:12px;color:var(--olive-mid);cursor:pointer;text-decoration:underline;text-align:center}

/* carpetas de ideas */
.folder-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.folder-card{padding:22px 18px;text-align:center;cursor:pointer;transition:.16s;position:relative}
.folder-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--sage)}
.folder-card .fico{font-size:38px;line-height:1;margin-bottom:8px}
.folder-card .fname{font-family:'Cormorant Garamond';font-size:23px;color:var(--olive-deep);line-height:1.1}
.folder-card .fmeta{font-size:11.5px;color:var(--muted);margin-top:3px}
.folder-lock{position:absolute;top:10px;right:12px;font-size:12px}
</style>
</head>

    else{sel.value=sel.dataset.fallback||'';}}
}
function creatableSelect(id,current,options,newLabel,extra){
  const seen=new Set();let html='';
  (extra||[]).forEach(([v,l])=>{seen.add(v);html+=`<option value="${esc(v)}"${v===current?' selected':''}>${esc(l)}</option>`;});
  options.forEach(o=>{if(o==null||seen.has(o))return;seen.add(o);html+=`<option value="${esc(o)}"${o===current?' selected':''}>${esc(o)}</option>`;});
  return `<select id="${id}" data-fallback="${esc(current||'')}" onchange="onCreatable(this)">${html}<option value="__NEW__">${newLabel}</option></select>`;
}

function renderPinScreen(u,first){
  $('#loginBody').innerHTML=`
    <div class="who">${first?'Creá tu PIN, '+u+' (4 números)':'Hola '+u+', ingresá tu PIN'}</div>
    <div class="pin-wrap">
      <input id="pinInput" class="pin-in" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
      ${first?'<input id="pinConfirm" class="pin-in" type="password" inputmode="numeric" maxlength="4" placeholder="repetí el PIN">':''}
      <div id="pinMsg" class="pin-msg"></div>
      <div class="pin-btns"><button class="btn" onclick="renderChooser()">← Volver</button><button class="btn btn-pri" onclick="submitPin('${u}',${first})">Entrar</button></div>
      ${first?'':`<div class="pin-forgot" onclick="forgotPin('${u}')">¿Olvidaste tu PIN?</div>`}
    </div>`;
  const i=$('#pinInput');setTimeout(()=>i&&i.focus(),60);
  i.addEventListener('keydown',e=>{if(e.key==='Enter')submitPin(u,first);});
}
function submitPin(u,first){
  const msg=m=>{const x=$('#pinMsg');if(x)x.textContent=m;};
  const pin=($('#pinInput').value||'').trim();
  if(!/^\d{4}$/.test(pin))return msg('El PIN son 4 números');
  if(first){const c=($('#pinConfirm').value||'').trim();if(pin!==c)return msg('Los dos PIN no coinciden');S.pins=S.pins||{};S.pins[u]=hashPin(pin);persist();doLogin(u);}
  else{if(!S.pins||S.pins[u]!==hashPin(pin))return msg('PIN incorrecto');doLogin(u);}
}
function forgotPin(u){if(confirm('¿Reiniciar el PIN de '+u+'? Vas a poder crear uno nuevo.')){if(S.pins)delete S.pins[u];persist();renderPinScreen(u,true);}}
function doLogin(u){ME=u;try{localStorage.setItem('wf_me',u);}catch(e){}$('#login').classList.add('hidden');$('#app').classList.remove('hidden');buildNav();go('inicio');}
function logout(){ME=null;try{localStorage.removeItem('wf_me');}catch(e){}$('#app').classList.add('hidden');$('#login').classList.remove('hidden');renderChooser();}
function toggleNav(open){const s=$('#side'),sc=$('#scrim');if(open){s.classList.add('open');sc.classList.add('show');}else{s.classList.remove('open');sc.classList.remove('show');}}

/* ============ NAV / ROUTER ============ */
const NAV=[
  ['inicio','Inicio','🏠'],['presupuesto','Presupuesto','💰'],['invitados','Invitados','👥'],
  ['mesas','Mesas','💺'],['cronograma','Cronograma','⏰'],['calendario','Calendario','📅'],
  ['proveedores','Proveedores','📸'],['ideas','Ideas','💡'],['postits','Post-its','📝'],['pendientes','Pendientes','✅']
];
const NAVMAP=Object.fromEntries(NAV.map(n=>[n[0],n]));
let route='inicio',editMode=false;
function visibleKeys(){let ks=(S.navOrder||NAV.map(n=>n[0]));if(isPlanner())ks=ks.filter(k=>k!=='presupuesto');return ks;}
function orderedNav(){return visibleKeys().filter(k=>NAVMAP[k]).map(k=>NAVMAP[k]);}
function buildNav(){
  $('#navlinks').innerHTML=orderedNav().map(([k,l,i])=>`<li data-r="${k}" draggable="${editMode}" data-key="${k}" onclick="navClick('${k}')"><span class="ico">${i}</span>${l}</li>`).join('');
  const u=ME;$('#footAv').textContent=(u==='Wedding planner'?'P':(u?u[0]:'?'));$('#footAv').style.background=respColor(u);$('#footNm').textContent=u;
  document.body.classList.toggle('editing',editMode);
  if(editMode)enableNavReorder();
}
function navClick(k){if(editMode)return;go(k);}
function toggleEdit(){editMode=!editMode;buildNav();render();toast(editMode?'Modo edición: arrastrá para reordenar':'Orden guardado ✓');}
function navReorder(from,to){const a=S.navOrder;const fi=a.indexOf(from),ti=a.indexOf(to);if(fi<0||ti<0||fi===ti)return;const[m]=a.splice(fi,1);a.splice(ti,0,m);persist();buildNav();render();}
function enableNavReorder(){
  let from=null;
  $$('#navlinks li').forEach(el=>{
    el.addEventListener('dragstart',()=>from=el.dataset.key);
    el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('dragover-key');});
    el.addEventListener('dragleave',()=>el.classList.remove('dragover-key'));
    el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('dragover-key');if(from&&from!==el.dataset.key)navReorder(from,el.dataset.key);});
  });
}
function go(r){route=r;toggleNav(false);render();}
function render(){
  if(route==='presupuesto'&&isPlanner())route='inicio';
  $$('#navlinks li').forEach(li=>li.classList.toggle('active',li.dataset.r===route));
  const nav=NAV.find(n=>n[0]===route);$('#mtitle').textContent=nav?nav[1]:'';
  ({inicio:vInicio,presupuesto:vPresupuesto,invitados:vInvitados,mesas:vMesas,cronograma:vCronograma,
    calendario:vCalendario,proveedores:vProveedores,ideas:vIdeas,postits:vPostits,pendientes:vPendientes}[route]||vInicio)();
  window.scrollTo(0,0);
}
const $$=(s,c=document)=>[...c.querySelectorAll(s)];

/* ============ CÁLCULOS ============ */
function totals(){
  let total=0,sena=0;S.budget.forEach(b=>{total+=Number(b.total)||0;sena+=Number(b.sena)||0;});
  let compras=0;S.compras.forEach(c=>{compras+=(Number(c.cantidad)||0)*(Number(c.precioUnit)||0);});
  const gran=total+compras;const falta=gran-sena;
  return {total,sena,compras,gran,falta};
}
function guestCounts(list){let a=0,n=0,fam=0;list.forEach(g=>{a+=g.adultos;n+=g.ninos;fam++;});return{a,n,fam,tot:a+n};}

function daysParts(){const now=new Date();const d=new Date(S.meta.date+'T12:00:00');const ms=d-now;
  const day=Math.max(0,Math.floor(ms/864e5));const wk=Math.floor(day/7);const mo=Math.floor(day/30.44);
  return{day,wk,mo,past:ms<0};}

function fmtDate(s){if(!s)return'';const d=new Date(s+'T12:00:00');return d.toLocaleDateString('es-UY',{day:'numeric',month:'short'});}

function setUSD(v){if(v){return openUSDModal();}showUSD=false;render();}
function setChart(t){chartType=t;render();}
function calcFin(){const m=Math.max(1,parseInt($('#finMonths').value)||1);const falta=totals().falta;
  $('#finOut').textContent=fmt(falta/m);$('#finNote').textContent=`${fmt(falta)} en ${m} cuotas`;}
function drawChart(){
  const ctx=$('#budChart');if(!ctx)return;if(chartRef)chartRef.destroy();
  let data=S.budget.filter(b=>Number(b.total)>0).map(b=>({label:b.item,val:Number(b.total)}));
  const cg={};S.compras.forEach(c=>{const v=(Number(c.cantidad)||0)*(Number(c.precioUnit)||0);if(v>0)cg[c.grupo||'Compras']=(cg[c.grupo||'Compras']||0)+v;});
  Object.entries(cg).forEach(([g,v])=>data.push({label:g,val:v}));
  data.sort((a,b)=>b.val-a.val);
  const colors=['#5B6248','#767C5E','#9AA284','#C3C7AE','#B4863E','#A98E6B','#8B6E8C','#6E7C8A','#5E8B7E','#9C6F5E','#8AA07A','#6A7F9C','#A87E7E','#8C8A5E','#7A8C6E','#B09A6A'];
  chartRef=new Chart(ctx,{type:chartType,data:{labels:data.map(d=>d.label),datasets:[{data:data.map(d=>d.val),backgroundColor:colors,borderWidth:chartType==='bar'?0:2,borderColor:'#fff',borderRadius:chartType==='bar'?6:0}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:chartType==='doughnut',position:'right',labels:{font:{family:'Jost',size:11},boxWidth:12,padding:8}}},
    scales:chartType==='bar'?{y:{ticks:{callback:v=>'$'+(v/1000)+'k',font:{family:'Jost'}}},x:{ticks:{font:{family:'Jost',size:9}}}}:{}}});
}

/* ============ MESAS ============ */
function mesaPool(){return S.mesas.base==='confirmados'?S.guests.filter(g=>g.estado==='confirmado'):S.guests.filter(g=>g.estado!=='noviene');}
function seatsOf(t){return t.seats||[];}
function occOf(t){let o=0;seatsOf(t).forEach(id=>{const g=S.guests.find(x=>x.id===id);if(g)o+=g.adultos+g.ninos;});return o;}
function assignedIds(){const s=new Set();S.mesas.tables.forEach(t=>seatsOf(t).forEach(id=>s.add(id)));return s;}
function vMesas(){
  const pool=mesaPool();const asg=assignedIds();
  const unassigned=pool.filter(g=>!asg.has(g.id));
  const totalCap=S.mesas.tables.reduce((a,t)=>a+(t.capacidad||0),0);
  const seated=S.mesas.tables.reduce((a,t)=>a+occOf(t),0);
  $('#view').innerHTML=`
  <div class="view-head">
    <div><h1>Mesas</h1><div class="sub">Armá el plano tal cual el salón · las familias se sientan enteras</div></div>
    <div class="head-actions no-print">
      <div class="seg"><button class="${S.mesas.base==='invitados'?'on':''}" onclick="setBase('invitados')">Todos los invitados</button><button class="${S.mesas.base==='confirmados'?'on':''}" onclick="setBase('confirmados')">Solo confirmados</button></div>
      <button class="btn" onclick="editMesa()">+ Mesa</button>
    </div>
  </div>
  <div class="mesa-bar">
    <span class="badge b-mut">${S.mesas.tables.length} mesas</span>
    <span class="badge b-mut">Capacidad ${totalCap}</span>
    <span class="badge b-ok">Sentados ${seated}</span>
    <span class="badge ${unassigned.length?'b-warn':'b-ok'}">${unassigned.length} familias sin asignar</span>
    <span style="font-size:12px;color:var(--muted)">· Arrastrá las mesas para acomodarlas</span>
  </div>
  <div class="plano" id="plano">
    ${S.mesas.tables.map(t=>mesaHTML(t)).join('')}
    ${unassigned.length?`<div class="unassigned no-print"><h4>Sin asignar (${unassigned.length})</h4>
      ${unassigned.map(g=>`<div class="ua-item" onclick="pickTable('${g.id}')"><span style="display:flex;align-items:center;gap:6px"><span class="dot" style="background:${famColor(g)}"></span>${esc(g.nombre)}</span><span class="pc">${g.adultos+g.ninos}</span></div>`).join('')}</div>`:''}
    ${!S.mesas.tables.length?`<div class="empty" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)"><div class="ei">💺</div><h3>Todavía no hay mesas</h3><p>Tocá "+ Mesa" para empezar a armar el plano</p></div>`:''}
  </div>`;
  enableDrag();
}
function mesaHTML(t){
  const occ=occOf(t);const cap=t.capacidad||0;const over=occ>cap;const full=occ===cap&&cap>0;
  const size=Math.max(74,Math.min(120,52+cap*7));
  const seats=[];for(let i=0;i<cap;i++){const ang=(i/cap)*2*Math.PI-Math.PI/2;const r=size/2+9;
    seats.push(`<span class="seat ${i<occ?'taken':''}" style="left:${size/2+r*Math.cos(ang)-7.5}px;top:${size/2+r*Math.sin(ang)-7.5}px"></span>`);}
  const fams=seatsOf(t).map(id=>{const g=S.guests.find(x=>x.id===id);if(!g)return'';return `<span class="fam-tag" style="background:${famColor(g)}" onclick="event.stopPropagation();unseat('${t.id}','${g.id}')" title="Quitar">${esc(g.nombre)} ✕</span>`;}).join('');
  return `<div class="mesa ${over?'over':''} ${full?'full':''}" data-id="${t.id}" style="left:${t.x}px;top:${t.y}px">
    <button class="mesa-edit no-print" onpointerdown="event.stopPropagation()" onclick="event.stopPropagation();editMesa('${t.id}')" title="Editar o eliminar">✎</button>
    <div class="mesa-top ${t.forma==='rect'?'rect':''}" style="width:${size}px;height:${t.forma==='rect'?size*0.66:size}px">
      ${seats.join('')}
      <div class="mesa-name">${esc(t.nombre)}</div><div class="mesa-occ">${occ}/${cap}</div>
    </div>
    <div class="mesa-fams">${fams}</div>
  </div>`;
}
function setBase(b){S.mesas.base=b;save();}
function editMesa(id){
  const sug='Mesa '+(S.mesas.tables.length+1);
  const t=id?S.mesas.tables.find(x=>x.id===id):{nombre:'',capacidad:10,forma:'circle'};
  modal(`<div class="modal-h"><h3>${id?'Editar mesa':'Nueva mesa'}</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
  <div class="modal-b">

      <div class="field"><label>Forma</label><select id="m_forma"><option value="circle"${t.forma!=='rect'?' selected':''}>Redonda</option><option value="rect"${t.forma==='rect'?' selected':''}>Rectangular</option></select></div>
    </div>
    ${id?'<button class="btn btn-sm" onclick="delMesa(\''+id+'\')" style="color:var(--danger)">🗑 Eliminar mesa</button>':''}

  const o={nombre:$('#m_nom').value.trim()||('Mesa '+(S.mesas.tables.length+1)),capacidad:parseInt($('#m_cap').value)||1,forma:$('#m_forma').value};
  if(id){Object.assign(S.mesas.tables.find(x=>x.id===id),o);}
  else{o.id=uid();o.seats=[];o.x=60+S.mesas.tables.length%5*150;o.y=70+Math.floor(S.mesas.tables.length/5)*160;S.mesas.tables.push(o);}
  closeModal();save();toast('Mesa guardada');

function delMesa(id){if(!confirm('¿Eliminar la mesa? Las familias vuelven a "sin asignar".'))return;S.mesas.tables=S.mesas.tables.filter(t=>t.id!==id);closeModal();save();}
function unseat(tid,gid){const t=S.mesas.tables.find(x=>x.id===tid);t.seats=t.seats.filter(i=>i!==gid);save();}
function pickForTable(tid){
  const t=S.mesas.tables.find(x=>x.id===tid);const asg=assignedIds();const pool=mesaPool().filter(g=>!asg.has(g.id));
  const left=(t.capacidad||0)-occOf(t);
  modal(`<div class="modal-h"><h3>${esc(t.nombre)}</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
  <div class="modal-b"><div class="sub" style="font-size:12.5px;color:var(--muted);margin-bottom:10px">Quedan ${left} lugares. Tocá una familia para sentarla entera.</div>
  ${pool.length?pool.map(g=>`<div class="ua-item" style="border:1px solid var(--line);margin-bottom:6px" onclick="seat('${tid}','${g.id}')"><span style="display:flex;align-items:center;gap:7px"><span class="dot" style="background:${famColor(g)}"></span>${esc(g.nombre)} <span style="font-size:11px;color:var(--muted)">(${esc(g.grupo)})</span></span><span class="pc">${g.adultos} ad${g.ninos?' · '+g.ninos+' ni':''}</span></div>`).join(''):'<div style="color:var(--muted);text-align:center;padding:16px">No quedan familias sin asignar 🎉</div>'}
  </div><div class="modal-f"><button class="btn" onclick="closeModal()">Listo</button></div>`);
}
function pickTable(gid){
  const g=S.guests.find(x=>x.id===gid);
  modal(`<div class="modal-h"><h3>Sentar a ${esc(g.nombre)}</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
  <div class="modal-b"><div class="sub" style="font-size:12.5px;color:var(--muted);margin-bottom:10px">${g.adultos+g.ninos} lugares. Elegí una mesa.</div>
  ${S.mesas.tables.length?S.mesas.tables.map(t=>{const left=(t.capacidad||0)-occOf(t);return `<div class="ua-item" style="border:1px solid var(--line);margin-bottom:6px" onclick="seat('${t.id}','${gid}')"><span>${esc(t.nombre)}</span><span class="pc" style="color:${left>=g.adultos+g.ninos?'var(--ok)':'var(--danger)'}">${left} libres</span></div>`;}).join(''):'<div style="color:var(--muted);text-align:center;padding:16px">Creá una mesa primero</div>'}
  </div><div class="modal-f"><button class="btn" onclick="closeModal()">Cancelar</button></div>`);
}
function seat(tid,gid){const t=S.mesas.tables.find(x=>x.id===tid);if(!t.seats)t.seats=[];if(!t.seats.includes(gid))t.seats.push(gid);

/* drag mesas */
let drag=null;
function enableDrag(){
  const plano=$('#plano');if(!plano)return;
  plano.querySelectorAll('.mesa').forEach(el=>{
    el.addEventListener('pointerdown',e=>{
      if(e.target.closest('.mesa-edit')||e.target.closest('.fam-tag'))return;
      const t=S.mesas.tables.find(x=>x.id===el.dataset.id);const r=plano.getBoundingClientRect();
      drag={el,t,dx:e.clientX-r.left-t.x,dy:e.clientY-r.top-t.y,moved:false,r};el.setPointerCapture(e.pointerId);el.classList.add('dragging');
    });
    el.addEventListener('pointermove',e=>{
      if(!drag||drag.el!==el)return;const nx=e.clientX-drag.r.left-drag.dx,ny=e.clientY-drag.r.top-drag.dy;
      if(Math.abs(nx-drag.t.x)+Math.abs(ny-drag.t.y)>4)drag.moved=true;
      drag.t.x=Math.max(40,Math.min(drag.r.width-40,nx));drag.t.y=Math.max(40,Math.min(drag.r.height-40,ny));
      el.style.left=drag.t.x+'px';el.style.top=drag.t.y+'px';
    });
    el.addEventListener('pointerup',e=>{if(!drag||drag.el!==el)return;el.classList.remove('dragging');const moved=drag.moved;const id=el.dataset.id;drag=null;persist();if(!moved)pickForTable(id);});
    el.addEventListener('dblclick',()=>editMesa(el.dataset.id));
  });
}

/* ============ CALENDARIO ============ */
let calM=(new Date()).getMonth(),calY=(new Date()).getFullYear();
function calEvents(){
  const ev=[];
  S.budget.forEach(b=>{if(b.senaFecha)ev.push({fecha:b.senaFecha,t:'Seña '+b.item,tipo:'pago'});});
  S.proveedores.forEach(p=>{if(p.fechaContrato)ev.push({fecha:p.fechaContrato,t:p.nombre,tipo:'prov'});});
  S.calendario.forEach(c=>ev.push({fecha:c.fecha,t:c.titulo,tipo:c.tipo||'ev'}));
  ev.push({fecha:S.meta.date,t:'💍 ¡La boda!',tipo:'ev'});
  return ev;
}
function vCalendario(){
  const ev=calEvents();const first=new Date(calY,calM,1);const start=(first.getDay()+6)%7;
  const days=new Date(calY,calM+1,0).getDate();const today=new Date().toISOString().slice(0,10);
  const dow=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];let cells='';
  for(let i=0;i<start;i++)cells+=`<div class="cal-cell out"></div>`;
  for(let d=1;d<=days;d++){const ds=`${calY}-${String(calM+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const de=ev.filter(e=>e.fecha===ds);
    cells+=`<div class="cal-cell ${ds===today?'today':''}" onclick="addCalEv('${ds}')"><div class="cal-day">${d}</div>${de.map(e=>`<div class="cal-ev ${e.tipo}">${esc(e.t)}</div>`).join('')}</div>`;}
  const mn=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  $('#view').innerHTML=`
  <div class="view-head"><div><h1>Calendario</h1><div class="sub">Señas, proveedores y fechas importantes · tocá un día para agregar</div></div>
    <button class="btn btn-pri no-print" onclick="addCalEv()">+ Fecha</button></div>
  <div class="card" style="padding:18px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <button class="btn btn-sm" onclick="calNav(-1)">←</button>
      <h2 style="font-size:26px">${mn[calM]} ${calY}</h2>
      <button class="btn btn-sm" onclick="calNav(1)">→</button>
    </div>
    <div class="cal-grid">${dow.map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div>
  </div>`;
}
function calNav(n){calM+=n;if(calM<0){calM=11;calY--;}if(calM>11){calM=0;calY++;}render();}
function addCalEv(ds){const t=prompt('Nombre de la fecha importante:');if(!t)return;let f=ds;if(!f){f=prompt('Fecha (AAAA-MM-DD):');if(!f)return;}
  S.calendario.push({id:uid(),fecha:f,titulo:t.trim(),tipo:'ev'});save();toast('Fecha agregada');}

function onIdeaImg(input){const f=input.files[0];if(!f)return;const r=new FileReader();

  r.readAsDataURL(f);}

function editPostit(id,v){const p=S.postits.find(x=>x.id===id);p.texto=v;persist();}

function enablePostitDrag(boardId){
  const board=document.getElementById(boardId||'board');if(!board)return;let d=null;
  board.querySelectorAll('.postit').forEach(el=>{
    el.addEventListener('pointerdown',e=>{if(e.target.tagName==='TEXTAREA'||e.target.classList.contains('pi-x'))return;
      const p=S.postits.find(x=>x.id===el.dataset.id);const r=board.getBoundingClientRect();
      d={el,p,dx:e.clientX-r.left-p.x,dy:e.clientY-r.top-p.y,r};el.setPointerCapture(e.pointerId);el.classList.add('dragging');});
    el.addEventListener('pointermove',e=>{if(!d||d.el!==el)return;
      d.p.x=Math.max(0,Math.min(d.r.width-172,e.clientX-d.r.left-d.dx));d.p.y=Math.max(0,Math.min(d.r.height-140,e.clientY-d.r.top-d.dy));
      el.style.left=d.p.x+'px';el.style.top=d.p.y+'px';});
    el.addEventListener('pointerup',()=>{if(!d||d.el!==el)return;el.classList.remove('dragging');d=null;persist();});
  });
}

/* ============ PENDIENTES ============ */
function vPendientes(){
  const cats=[...new Set(S.pendientes.map(p=>p.cat||'General'))];
  const done=S.pendientes.filter(p=>p.hecho).length;
  let html='';
  cats.forEach(cat=>{
    html+=`<h3 style="font-size:20px;margin:18px 0 8px">${esc(cat)}</h3>`;
    S.pendientes.filter(p=>(p.cat||'General')===cat).forEach(p=>{
      html+=`<div class="card pend-item ${p.hecho?'done':''}">
        <div class="check ${p.hecho?'on':''}" onclick="toggleP('${p.id}')">${p.hecho?'✓':''}</div>
        <div style="flex:1"><div class="pt">${esc(p.titulo)}</div>${p.texto?`<div class="pd">${esc(p.texto)}</div>`:''}
          <div class="pmeta">${p.fecha?`<span class="badge b-warn">📅 ${fmtDate(p.fecha)}</span>`:''}${p.resp?`<span class="badge" style="background:${respColor(p.resp)}22;color:${respColor(p.resp)}">${esc(p.resp)}</span>`:'<span class="badge b-mut">Sin responsable</span>'}</div></div>
        <span class="no-print"><button class="icon-btn" onclick="editPend('${p.id}')">✎</button><button class="icon-btn" onclick="delItem('pendientes','${p.id}')">🗑</button></span>
      </div>`;
    });
  });
  $('#view').innerHTML=`
  <div class="view-head"><div><h1>Pendientes</h1><div class="sub">${done} de ${S.pendientes.length} completados</div></div>
    <button class="btn btn-pri no-print" onclick="editPend()">+ Pendiente</button></div>
  <div class="progress" style="margin-bottom:8px"><i style="width:${S.pendientes.length?done/S.pendientes.length*100:0}%"></i></div>
  ${S.pendientes.length?html:'<div class="empty"><div class="ei">✅</div><h3>Sin pendientes</h3></div>'}`;
}
function toggleP(id){const p=S.pendientes.find(x=>x.id===id);p.hecho=!p.hecho;save();}
function editPend(id){
  const p=id?S.pendientes.find(x=>x.id===id):{titulo:'',texto:'',fecha:'',resp:ME,cat:'General',hecho:false};
  const cats=[...new Set(['General',...S.pendientes.map(x=>x.cat||'General')])];
  const resps=[...new Set([...(S.responsables||[]),p.resp].filter(Boolean))];
  modal(`<div class="modal-h"><h3>${id?'Editar pendiente':'Nuevo pendiente'}</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
  <div class="modal-b">
    <div class="field"><label>Título</label><input id="pd_t" value="${esc(p.titulo)}"></div>
    <div class="field"><label>Detalle</label><input id="pd_x" value="${esc(p.texto||'')}"></div>
    <div class="row3">
      <div class="field"><label>Fecha</label><input id="pd_f" type="date" value="${p.fecha||''}"></div>
      <div class="field"><label>Responsable</label>${creatableSelect('pd_r',p.resp||'',resps,'➕ Nuevo responsable…',[['','Sin responsable']])}</div>
      <div class="field"><label>Categoría</label>${creatableSelect('pd_c',p.cat||'General',cats,'➕ Crear categoría…')}</div>
    </div></div>
  <div class="modal-f"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-pri" onclick="savePend('${id||''}')">Guardar</button></div>`);
}
function savePend(id){const resp=$('#pd_r').value;const o={titulo:$('#pd_t').value.trim(),texto:$('#pd_x').value.trim(),fecha:$('#pd_f').value,resp:resp,cat:$('#pd_c').value.trim()||'General'};
  if(!o.titulo){toast('Poné un título');return;}
  if(resp&&resp!=='__NEW__'&&!S.responsables.includes(resp))S.responsables.push(resp);
  if(id)Object.assign(S.pendientes.find(x=>x.id===id),o);else{o.id=uid();o.hecho=false;S.pendientes.push(o);}closeModal();save();}

      if(data._rev && data._rev===myRev){ ready=true; dot('Sincronizado con la nube ✓','#5E7B4E'); return; }
